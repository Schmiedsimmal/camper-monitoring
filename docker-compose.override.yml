# =============================================================================
# Lokales Development-Override (x86 ohne NVIDIA-Runtime und GPIO).
#
# Diese Datei wird von docker compose automatisch neben docker-compose.yml
# geladen und deaktiviert GPU- und GPIO-spezifische Einstellungen, die auf
# Dev-Maschinen ohne NVIDIA Container Runtime / GPIO-Hardware zu Fehlern
# fuehren wuerden.
#
# Auf dem Jetson: diese Datei loeschen oder umbenennen
#   (mv docker-compose.override.yml docker-compose.override.yml.disabled)
# =============================================================================

services:
  backup-camera:
    # runtime: nvidia ist im Base-File gesetzt; hier ohne GPU laufen lassen.
    runtime: ""
    environment:
      - NVIDIA_VISIBLE_DEVICES=
      - NVIDIA_DRIVER_CAPABILITIES=
      - PYTHONUNBUFFERED=1
      - TZ=${TZ:-Europe/Berlin}
    # GPIO gibt es auf x86 nicht. Video-Device: RealSense D455F RGB-Stream
    # liegt auf /dev/video6 (Host) und wird als /dev/video0 (Container)
    # gemappt. Auf dem Jetson: Override loeschen, dann gilt docker-compose.yml.
    # !override ersetzt die Device-Liste aus docker-compose.yml komplett.
    devices: !override
      - /dev/video6:/dev/video0
    volumes:
      - /sys:/sys:ro
      - backup-camera-models:/app/models
