# This is NOT an active compose file, but a snippet to copy into the
# root docker-compose.yml when adding a new service.

services:
  <my-service>:
    <<: *common
    build:
      context: .
      dockerfile: services/<my-service>/Dockerfile
    container_name: <my-service>
    ports:
      - "${MY_SERVICE_PORT:-808X}:8080"
